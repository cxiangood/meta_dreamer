#能看到此处修改
defaults:

  logdir: ~/logdir/{timestamp}
  replica: 0
  replicas: 1
  method: name
  task: dummy_disc
  seed: 0
  script: train
  batch_size: 16
  batch_length: 64
  report_length: 32
  consec_train: 1
  consec_report: 1
  replay_context: 1
  random_agent: False
  clock_addr: ''
  clock_port: ''
  ipv6: False
  errfile: False

  logger:
    outputs: [jsonl, scope]
    filter: 'score|length|fps|ratio|train/loss/|train/rand/'
    timer: True
    fps: 15
    user: ''

  env:
    atari: {size: [96, 96], repeat: 4, sticky: True, gray: True, actions: all, lives: unused, noops: 30, autostart: False, pooling: 2, aggregate: max, resize: pillow, clip_reward: False}
    procgen: {size: [96, 96], resize: pillow}
    crafter: {size: [64, 64], logs: False}
    atari100k: {size: [64, 64], repeat: 4, sticky: False, gray: False, actions: needed, lives: unused, noops: 30, autostart: False, resize: pillow, clip_reward: False}
    dmlab: {size: [64, 64], repeat: 4, episodic: True, use_seed: True}
    minecraft: {size: [64, 64], break_speed: 100.0, logs: False, length: 36000}
    dmc: {size: [64, 64], repeat: 1, proprio: True, image: True, camera: -1}
    loconav: {size: [64, 64], repeat: 1, camera: -1}
    # carla: {size: [64, 64], repeat: 1, host: localhost, port: 2000, town: Mine_01, weather: ClearNoon, fps: 20, max_episode_steps: 1000}
    carla0915: {size: [64, 64], repeat: 1, host: 127.0.0.1, port: 50037, fps: 1}
    metadrive: {size: [64,64], repeat: 2, length: 1000}
    ilrl: {size: [64,64], repeat: 2, length: 1000}

  replay:
    size: 5e6
    online: True
    fracs: {uniform: 1.0, priority: 0.0, recency: 0.0}
    prio: {exponent: 0.8, maxfrac: 0.5, initial: inf, zero_on_sample: True}
    priosignal: model
    recexp: 1.0
    chunksize: 1024

  run:
    steps: 1e10
    duration: 0
    train_ratio: 32.0
    log_every: 120
    report_every: 300
    save_every: 900
    envs: 16
    eval_envs: 4
    eval_eps: 1
    report_batches: 1
    from_checkpoint: ''
    episode_timeout: 180
    actor_addr: 'localhost:{auto}'
    replay_addr: 'localhost:{auto}'
    logger_addr: 'localhost:{auto}'
    actor_batch: -1
    actor_threads: 1
    agent_process: False
    remote_replay: False
    remote_envs: False
    usage: {psutil: True, nvsmi: True, gputil: False, malloc: False, gc: False}
    debug: True

  jax:
    platform: cuda
    compute_dtype: bfloat16
    policy_devices: [0]
    train_devices: [0]
    mock_devices: 0
    prealloc: True
    jit: True
    debug: False
    expect_devices: 0
    enable_policy: True
    coordinator_address: ''

  agent:
    loss_scales: {rec: 1.0, rew: 1.0, con: 1.0, dyn: 1.0, rep: 0.1, policy: 1.0, value: 1.0, repval: 0.3}
    opt: {lr: 4e-5, agc: 0.3, eps: 1e-20, beta1: 0.9, beta2: 0.999, momentum: True, wd: 0.0, schedule: const, warmup: 1000, anneal: 0}
    ac_grads: False
    dyn:
      typ: rssm
      rssm: {deter: 8192, hidden: 1024, stoch: 32, classes: 64, act: silu, norm: rms, unimix: 0.01, outscale: 1.0, winit: trunc_normal_in, imglayers: 2, obslayers: 1, dynlayers: 1, absolute: False, blocks: 8, free_nats: 1.0}
    enc:
      typ: simple
      simple: {depth: 64, mults: [2, 3, 4, 4], layers: 3, units: 1024, act: silu, norm: rms, winit: trunc_normal_in, symlog: True, outer: False, kernel: 5, strided: False}
      # SIGLIP 2 Vision Encoder configuration for VLA architecture
      siglip:
        siglip_path: ""  # Path to pretrained SIGLIP 2 model (e.g., ../siglip2-so400m-patch16-256)
        output_dim: 1024  # Output dimension to match RSSM token input
        freeze_backbone: True  # Whether to freeze SIGLIP weights
        aggregation: mean  # 'cls', 'mean', or 'patches'
        proj_layers: 2  # Number of projection layers after SIGLIP
        proj_hidden: 1024  # Hidden dimension for projection
        act: silu
        norm: rms
        winit: trunc_normal_in
        image_size: 256  # SIGLIP so400m uses 256x256
        patch_size: 16
      # Pure JAX ViT-style encoder (SIGLIP-inspired, no PyTorch dependency)
      siglip_jax:
        output_dim: 1024
        vit_dim: 512
        vit_layers: 6
        vit_heads: 8
        patch_size: 16
        image_size: 64
        proj_layers: 2
        act: silu
        norm: rms
        winit: trunc_normal_in
        symlog: True
      # VLA encoder combining SIGLIP with language conditioning (future)
      vla:
        siglip_path: ""
        output_dim: 1024
        freeze_siglip: True
        use_language: False
        fusion_type: concat
        proj_layers: 2
        act: silu
        norm: rms
        winit: trunc_normal_in
    dec:
      typ: simple
      simple: {depth: 64, mults: [2, 3, 4, 4], layers: 3, units: 1024, act: silu, norm: rms, outscale: 1.0, winit: trunc_normal_in, outer: False, kernel: 5, bspace: 8, strided: False}
    rewhead: {layers: 1, units: 1024, act: silu, norm: rms, output: symexp_twohot, outscale: 0.0, winit: trunc_normal_in, bins: 255}
    conhead: {layers: 1, units: 1024, act: silu, norm: rms, output: binary, outscale: 1.0, winit: trunc_normal_in}
    policy: {layers: 3, units: 1024, act: silu, norm: rms, minstd: 0.1, maxstd: 1.0, outscale: 0.01, unimix: 0.01, winit: trunc_normal_in}
    value: {layers: 3, units: 1024, act: silu, norm: rms, output: symexp_twohot, outscale: 0.0, winit: trunc_normal_in, bins: 255}
    policy_dist_disc: categorical
    policy_dist_cont: bounded_normal
    imag_last: 0
    imag_length: 15
    horizon: 333
    contdisc: True
    imag_loss: {slowtar: False, lam: 0.95, actent: 3e-4, slowreg: 1.0}
    repl_loss: {slowtar: False, lam: 0.95, slowreg: 1.0}
    slowvalue: {rate: 0.02, every: 1}
    retnorm: {impl: perc, rate: 0.01, limit: 1.0, perclo: 5.0, perchi: 95.0, debias: False}
    valnorm: {impl: none, rate: 0.01, limit: 1e-8}
    advnorm: {impl: none, rate: 0.01, limit: 1e-8}
    reward_grad: True
    repval_loss: True
    repval_grad: True
    report: True
    report_gradnorms: False

size1m: &size1m
  .*\.rssm: {deter: 512, hidden: 64, classes: 4}
  .*\.depth: 4
  .*\.units: 64

size12m: &size12m
  .*\.rssm: {deter: 2048, hidden: 256, classes: 16}
  .*\.depth: 16
  .*\.units: 256

size25m: &size25m
  .*\.rssm: {deter: 3072, hidden: 384, classes: 24}
  .*\.depth: 24
  .*\.units: 384

size50m: &size50m
  .*\.rssm: {deter: 4096, hidden: 512, classes: 32}
  .*\.depth: 32
  .*\.units: 512

size100m: &size100m
  .*\.rssm: {deter: 6144, hidden: 768, classes: 48}
  .*\.depth: 48
  .*\.units: 768

size200m: &size200m
  .*\.rssm: {deter: 8192, hidden: 1024, classes: 64}
  .*\.depth: 64
  .*\.units: 1024

size400m: &size400m
  .*\.rssm: {deter: 12288, hidden: 1536, classes: 96}
  .*\.depth: 96
  .*\.units: 1536

carla0915:
  task: carla0915_keeping
  run: {steps: 1.1e4, envs: 1, train_ratio: 16}

minecraft:
  task: minecraft_diamond

dmlab:
  task: dmlab_explore_goal_locations_small
  run: {steps: 2.6e7, train_ratio: 32}

atari:
  task: atari_pong
  run: {steps: 5.1e7, train_ratio: 32}

procgen:
  task: procgen_coinrun
  run: {steps: 1.1e8, train_ratio: 64}

atari100k:
  task: atari100k_pong
  run: {steps: 1.1e5, envs: 1, train_ratio: 256}

crafter:
  task: crafter_reward
  run: {steps: 1.1e6, envs: 1, train_ratio: 512}

dmc_proprio:
  <<: *size1m
  task: dmc_walker_walk
  env.dmc.image: False
  run: {steps: 1.1e6, train_ratio: 1024}

dmc_vision:
  task: dmc_walker_walk
  env.dmc.proprio: False
  run: {steps: 1.1e6, train_ratio: 256}

bsuite:
  task: bsuite_mnist/0
  run: {envs: 1, save_every: -1, train_ratio: 1024}

metadrive_lane_keeping:
  <<: *size12m
  task: metadrive_lane_keeping
  env.metadrive.size: [64,64]  # 更新为320x320分辨率
  env.metadrive.repeat: 1
  run: {steps: 1e6, train_ratio: 32, envs: 4, eval_envs: 4}  # 增加到4个并行环境
  batch_size: 8
  jax: {prealloc: false, debug: false}  # 移除platform设置，让JAX自动选择
  logger:
    outputs: [jsonl, tensorboard]
    filter: 'score|length|reward|loss|train/|eval/|log/'

metadrive_lane_keeping_dagger:
  <<: *size12m
  task: metadrive_lane_keeping
  env.metadrive.size: [64,64]
  env.metadrive.repeat: 1
  env.metadrive.length: 1000
  # DAgger scheduling: start with 80% expert, decay to 10% over 500k steps
  env.metadrive.expert_prob_init: 0.8     # High expert usage at start (IL warmup)
  env.metadrive.expert_prob_final: 0.1    # Low expert usage at end (mostly RL)
  env.metadrive.expert_decay_steps: 500000
  env.metadrive.expert_decay_type: cosine # Options: linear, exponential, cosine, step
  env.metadrive.action_threshold: 0.3     # Also use expert if action diff > 0.3
  run: {steps: 2e6, train_ratio: 32, envs: 1, eval_envs: 1}
  batch_size: 16
  jax: {prealloc: false, debug: false}
  logger:
    outputs: [jsonl, tensorboard]
    filter: 'score|length|reward|loss|train/|eval/|log/'

ilrl:
  <<: *size12m
  task: ilrl_lanekeep
  env.metadrive.size: [64,64]
  env.metadrive.repeat: 1
  env.metadrive.length: 1000
  run: {steps: 1e6, train_ratio: 32, envs: 4, eval_envs: 2}
  batch_size: 8
  jax: {prealloc: false, debug: false}
  logger:
    outputs: [jsonl, tensorboard]
    filter: 'score|length|reward|loss|train/|eval/|log/'

metadrive_test:
  <<: *size1m
  task: metadrive_lane_keeping
  env.metadrive.size: [64,64]  # 更新为320x320分辨率
  env.metadrive.repeat: 1
  env.metadrive.length: 200
  run: {steps: 1e4, train_ratio: 32, envs: 2, eval_envs: 1}

metadrive_cpu:
  <<: *size1m
  task: metadrive_lane_keeping
  env.metadrive.size: [64,64]  # 更新为320x320分辨率
  env.metadrive.repeat: 1
  env.metadrive.length: 100  # 非常短的episode用于测试
  run: {steps: 100, train_ratio: 4, envs: 1, eval_envs: 1}
  batch_size: 1
  batch_length: 2
  jax: {platform: cpu, prealloc: false, debug: true}  # 强制使用CPU

metadrive_on_ramp:
  <<: *size12m
  task: metadrive_on_ramp
  env.metadrive.size: [64,64]
  env.metadrive.repeat: 1
  env.metadrive.length: 1000
  run: {steps: 1e6, train_ratio: 32, envs: 4, eval_envs: 4}
  batch_size: 8
  jax: {prealloc: false, debug: false}
  logger:
    outputs: [jsonl, tensorboard]
    filter: 'score|length|reward|loss|train/|eval/|log/'

metadrive_lane_reduction:
  <<: *size12m
  task: metadrive_lane_reduction
  env.metadrive.size: [64,64]
  env.metadrive.repeat: 1
  env.metadrive.length: 1000
  run: {steps: 1e6, train_ratio: 32, envs: 4, eval_envs: 4}
  batch_size: 8
  jax: {prealloc: false, debug: false}
  logger:
    outputs: [jsonl, tensorboard]
    filter: 'score|length|reward|loss|train/|eval/|log/'

loconav:
  task: loconav_ant_maze_m
  env.loconav.repeat: 1
  run.train_ratio: 256

multicpu:
  batch_size: 12
  jax.mock_devices: 8
  jax.policy_devices: [0, 1]
  jax.train_devices: [2, 3, 4, 5, 6, 7]

debug:
  batch_size: 8
  batch_length: 10
  report_length: 5
  jax: {platform: cpu, debug: True, prealloc: False}
  run: {envs: 4, report_every: 10, log_every: 5, save_every: 15, train_ratio: 8, debug: True}
  replay.size: 1e4
  agent:
    .*\.bins: 5
    .*\.layers: 1
    .*\.units: 8
    .*\.stoch: 2
    .*\.classes: 4
    .*\.deter: 8
    .*\.hidden: 3
    .*\.blocks: 4
    .*\.depth: 2

# ============================================================================
# VLA (Vision-Language-Action) + World Model Configurations
# ============================================================================
# These configurations use SIGLIP 2 as the visual encoder combined with
# DreamerV3's world model for vision-based autonomous driving tasks.

# VLA with SIGLIP 2 for MetaDrive lane keeping
vla_metadrive:
  <<: *size12m
  task: metadrive_lane_keeping
  env.metadrive.size: [256, 256]  # Match SIGLIP input size
  env.metadrive.repeat: 1
  env.metadrive.length: 1000
  run: {steps: 1e6, train_ratio: 32, envs: 2, eval_envs: 2}
  batch_size: 4
  jax: {prealloc: false, debug: false}
  agent:
    enc:
      typ: siglip
      siglip:
        siglip_path: "../siglip2-so400m-patch16-256"
        output_dim: 1024
        freeze_backbone: True
        aggregation: mean
        proj_layers: 2
        proj_hidden: 1024
  logger:
    outputs: [jsonl, tensorboard]
    filter: 'score|length|reward|loss|train/|eval/|log/'

# VLA with pure JAX encoder (no PyTorch dependency)
vla_jax_metadrive:
  <<: *size12m
  task: metadrive_lane_keeping
  env.metadrive.size: [64, 64]
  env.metadrive.repeat: 1
  env.metadrive.length: 1000
  run: {steps: 1e6, train_ratio: 32, envs: 4, eval_envs: 2}
  batch_size: 8
  jax: {prealloc: false, debug: false}
  agent:
    enc:
      typ: siglip_jax
      siglip_jax:
        output_dim: 1024
        vit_dim: 512
        vit_layers: 6
        vit_heads: 8
        patch_size: 8  # Smaller patch for 64x64 images
        image_size: 64
        proj_layers: 2
  logger:
    outputs: [jsonl, tensorboard]
    filter: 'score|length|reward|loss|train/|eval/|log/'

# VLA for CARLA with SIGLIP
vla_carla:
  <<: *size12m
  task: carla0915_keeping
  env.carla0915.size: [256, 256]
  run: {steps: 1e6, train_ratio: 16, envs: 1, eval_envs: 1}
  batch_size: 4
  agent:
    enc:
      typ: siglip
      siglip:
        siglip_path: "../siglip2-so400m-patch16-256"
        output_dim: 1024
        freeze_backbone: True
        aggregation: mean
  logger:
    outputs: [jsonl, tensorboard]

# Debug VLA configuration
vla_debug:
  <<: *size1m
  task: metadrive_lane_keeping
  env.metadrive.size: [64, 64]
  env.metadrive.repeat: 1
  env.metadrive.length: 100
  run: {steps: 1000, train_ratio: 4, envs: 1, eval_envs: 1}
  batch_size: 2
  batch_length: 8
  jax: {platform: cpu, prealloc: false, debug: true}
  agent:
    enc:
      typ: siglip_jax
      siglip_jax:
        output_dim: 64
        vit_dim: 64
        vit_layers: 2
        vit_heads: 4
        patch_size: 8
        image_size: 64
        proj_layers: 1
# ============================================================================
# VLA + IL/RL Configurations (SIGLIP 2 + DreamerV3 + Imitation Learning)
# ============================================================================

# VLA with SIGLIP 2 for IL+RL (using pretrained SIGLIP backbone)
vla_ilrl:
  <<: *size12m
  task: ilrl_lanekeep
  env.ilrl.size: [256, 256]  # Match SIGLIP 2 input size
  env.ilrl.repeat: 1
  env.ilrl.length: 1000
  run: {steps: 2e6, train_ratio: 32, envs: 1, eval_envs: 1}
  batch_size: 8
  jax: {prealloc: false, debug: false}
  agent:
    enc:
      typ: siglip
      siglip:
        siglip_path: "../siglip2-so400m-patch16-256"
        output_dim: 1024
        freeze_backbone: True
        aggregation: mean
        proj_layers: 2
        proj_hidden: 1024
  logger:
    outputs: [jsonl, tensorboard]
    filter: 'score|length|reward|loss|train/|eval/|log/'

# VLA IL+RL with pure JAX encoder (no PyTorch dependency, 64x64 images)
vla_ilrl_jax:
  <<: *size12m
  task: ilrl_lanekeep
  env.ilrl.size: [64, 64]
  env.ilrl.repeat: 1
  env.ilrl.length: 1000
  run: {steps: 2e6, train_ratio: 32, envs: 1, eval_envs: 1}
  batch_size: 8
  jax: {prealloc: false, debug: false}
  agent:
    enc:
      typ: siglip_jax
      siglip_jax:
        output_dim: 1024
        vit_dim: 512
        vit_layers: 6
        vit_heads: 8
        patch_size: 8
        image_size: 64
        proj_layers: 2
  logger:
    outputs: [jsonl, tensorboard]
    filter: 'score|length|reward|loss|train/|eval/|log/'